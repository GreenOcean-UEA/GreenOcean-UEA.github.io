name: Publish Documentation

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      ref:
        description: "PlankTOM-NEMO-V5 branch, tag or commit to build"
        required: true
        default: "main"
      deploy:
        description: "Publish to GitHub Pages (replaces the live docs)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: 'GreenOcean-UEA/PlankTOM-NEMO-V5'
          # Manual runs build the chosen ref; push/PR runs build main as before
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.PLANKTOM_TOKEN }}

      - name: Render Docs
        id: build
        run: |
          cd docs
          pip3 install -r requirements.txt
          make html

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html/
  deploy:
    needs: build
    # Manual runs only publish when the "deploy" box is ticked
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: PlankTOM-NEMO5-docs
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
